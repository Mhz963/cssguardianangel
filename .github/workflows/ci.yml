name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # the site never needs the native ONNX download from nuget.org
      - run: npm run lint
      - run: npm run check:english
      - run: npm run check:practice
      - run: npm run build
      - run: npm audit --audit-level=high
