name: Refresh conflict atlas data

# Rebuilds public/data/conflicts.json from free, keyless sources (Wikipedia, Wikidata, GDELT)
# and commits it, so the live site only ever reads a cached file.
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: conflicts-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build conflicts.json
        run: node scripts/build-conflicts.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/conflicts.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "conflict-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/conflicts.json
          git commit -m "Refresh conflict atlas data"
          git push
